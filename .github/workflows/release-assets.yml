name: Release assets

# При публикации выпуска собирает архив шаблона и прикладывает его к выпуску.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build archive
        run: |
          set -euo pipefail
          V=$(grep -oP '(?<=<version>)[^<]+' templateDetails.xml | head -1)
          mkdir -p dist
          zip -qr dist/tpl_wmarka_clean-$V.zip . -x '.git/*' '.github/*' 'updates/*' 'dist/*'
          # Архив для распаковки в корень сайта поверх установленного шаблона
          mkdir -p root/templates/wmarka_clean root/media/templates/site/wmarka_clean root/language
          rsync -a --exclude='.git' --exclude='.github' --exclude='updates' --exclude='media' --exclude='language' --exclude='dist' --exclude='root' ./ root/templates/wmarka_clean/
          cp -r media/. root/media/templates/site/wmarka_clean/
          cp -r language/. root/language/
          (cd root && zip -qr ../dist/tpl_wmarka_clean-${V}_files.zip .)
          (cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
